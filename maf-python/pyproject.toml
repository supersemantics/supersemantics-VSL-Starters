[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vsl-starter-maf-refund-agent"
version = "0.1.0"
description = "Starter: a refund agent on the Microsoft Agent Framework with VSL gates on its tools."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    # From PyPI. vsl-core is published as super-semantics-vsl (imported as vsl_core).
    "super-semantics-vsl>=0.3.1,<0.4",
    "vsl-maf>=0.2.2,<0.3",
    "agent-framework-core>=1.25,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["refund_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
